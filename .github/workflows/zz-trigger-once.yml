name: Trigger daily analysis once

on:
  push:
    paths:
      - '.github/workflows/zz-trigger-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch daily analysis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run 00-daily-analysis.yml \
            --repo ${{ github.repository }} \
            -f mode=full \
            -f region=cn \
            -f force_run=false
