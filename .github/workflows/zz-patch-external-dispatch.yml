name: Patch external scheduler dispatch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zz-patch-external-dispatch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Patch production workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/00-daily-analysis.yml')
          text = path.read_text(encoding='utf-8')

          old_trigger = """on:\n  schedule:\n    # GitHub cron 使用 UTC。以下时间对应北京时间（UTC+8）。\n    # 09:05：推送上一交易时段的美股大盘复盘（仅大盘）\n    - cron: '5 1 * * 1-5'\n    # 11:35：A股午间休市后，推送大盘 + 自选股\n    - cron: '35 3 * * 1-5'\n    # 15:10：A股收盘后，推送大盘 + 自选股\n    - cron: '10 7 * * 1-5'\n\n  # 手动触发\n"""
          new_trigger = """on:\n  # 手动触发，也供 cron-job.org 通过 workflow_dispatch 调用\n"""
          if old_trigger not in text:
              raise SystemExit('expected schedule trigger block not found')
          text = text.replace(old_trigger, new_trigger, 1)

          old_inputs = """          - full          # 完整分析（股票+大盘）\n          - market-only   # 仅大盘复盘\n          - stocks-only   # 仅股票分析\n      force_run:\n"""
          new_inputs = """          - full          # 完整分析（股票+大盘）\n          - market-only   # 仅大盘复盘\n          - stocks-only   # 仅股票分析\n      region:\n        description: '大盘区域'\n        required: true\n        default: 'cn'\n        type: choice\n        options:\n          - cn\n          - us\n      force_run:\n"""
          if old_inputs not in text:
              raise SystemExit('expected workflow_dispatch input block not found')
          text = text.replace(old_inputs, new_inputs, 1)

          mode_expr = '$' + "{{ github.event.inputs.mode || 'full' }}"
          region_expr = '$' + "{{ github.event.inputs.region || 'cn' }}"
          old_dispatch = f"""          else\n            MODE=\"{mode_expr}\"\n          fi\n"""
          new_dispatch = f"""          else\n            MODE=\"{mode_expr}\"\n            export MARKET_REVIEW_REGION=\"{region_expr}\"\n            echo \"🌍 手动/外部调度：大盘区域=$MARKET_REVIEW_REGION\"\n          fi\n"""
          if old_dispatch not in text:
              raise SystemExit('expected dispatch mode block not found')
          text = text.replace(old_dispatch, new_dispatch, 1)

          path.write_text(text, encoding='utf-8')
          PY

          rm -f .github/workflows/schedule-resync-probe.yml
          rm -f .scheduler-resync
          rm -f .github/workflows/zz-patch-external-dispatch.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: support external scheduler region dispatch'
          git push origin HEAD:main
