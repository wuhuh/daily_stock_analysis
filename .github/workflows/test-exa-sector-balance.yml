name: Exa News + Sector Balance Smoke

on:
  push:
    branches:
      - feat/exa-news-sector-balance

jobs:
  market-smoke:
    runs-on: ubuntu-latest
    environment: STOCK_LIST
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        region: [cn, us]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run market review
        env:
          GENERATION_BACKEND: litellm
          GENERATION_FALLBACK_BACKEND: litellm
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: minimax-m3
          REPORT_TYPE: brief
          REPORT_LANGUAGE: zh
          MARKET_REVIEW_ENABLED: 'true'
          MARKET_REVIEW_REGION: ${{ matrix.region }}
          TRADING_DAY_CHECK_ENABLED: 'false'
          EXA_MCP_SEARCH_ENABLED: 'true'
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
          WECHAT_MSG_TYPE: markdown
        run: |
          mkdir -p reports logs data
          set -o pipefail
          python main.py --market-review --force-run 2>&1 | tee logs/smoke-${{ matrix.region }}.log

      - name: Assert Exa, MiniMax and concise report
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          region = '${{ matrix.region }}'
          log = Path(f'logs/smoke-{region}.log').read_text(encoding='utf-8', errors='replace')
          reports = sorted(Path('reports').glob('market_review_*.md'))
          if not reports:
              raise SystemExit('No market review report generated')
          text = reports[-1].read_text(encoding='utf-8', errors='replace')

          print('region:', region)
          print('chars:', len(text))
          print('bytes:', len(text.encode('utf-8')))
          print(text[:1800])

          required = [
              'anthropic/minimax-m3',
              '已启用 Exa MCP 实时新闻搜索',
              '企业微信消息发送成功',
              'action=generate_review status=success',
          ]
          missing = [item for item in required if item.lower() not in log.lower()]
          if missing:
              raise SystemExit(f'Missing required evidence: {missing}')

          exa_match = re.search(r"\[ExaMCP\].*返回\s+([1-9]\d*)\s+条", log)
          if not exa_match:
              raise SystemExit('Exa MCP did not return any search result')
          if not re.search(r"有日期\s+[1-9]\d*\s+条", log):
              raise SystemExit('Exa MCP results did not include published dates')

          market_news_match = re.search(r"action=search_market_news status=success count=(\d+)", log)
          if not market_news_match or int(market_news_match.group(1)) <= 0:
              raise SystemExit('No market news survived the search pipeline')

          if len(text) > 1400:
              raise SystemExit(f'Report too long: {len(text)} chars')
          if any(line.lstrip().startswith('|') for line in text.splitlines()):
              raise SystemExit('Brief report still contains Markdown tables')

          if region == 'cn':
              for label in ('**领涨**', '**领跌**'):
                  if label not in text:
                      raise SystemExit(f'Missing A-share sector block: {label}')
              if '**主线**' in text:
                  raise SystemExit('A-share brief still uses old mainline-only label')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exa-sector-${{ matrix.region }}-${{ github.run_attempt }}
          path: |
            reports/
            logs/
          if-no-files-found: warn
