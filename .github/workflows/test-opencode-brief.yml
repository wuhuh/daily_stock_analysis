name: OpenCode Go Brief Smoke Test

on:
  push:
    branches:
      - fix/opencode-go-brief-wechat

jobs:
  market-smoke:
    runs-on: ubuntu-latest
    environment: STOCK_LIST
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        region: [cn, us]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run concise market review
        env:
          # sitecustomize.py is intentionally loaded from the repository root.
          PYTHONPATH: ${{ github.workspace }}
          GENERATION_BACKEND: litellm
          GENERATION_FALLBACK_BACKEND: litellm
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: minimax-m3
          REPORT_TYPE: brief
          REPORT_LANGUAGE: zh
          MARKET_REVIEW_ENABLED: 'true'
          MARKET_REVIEW_REGION: ${{ matrix.region }}
          TRADING_DAY_CHECK_ENABLED: 'false'
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
          WECHAT_MSG_TYPE: markdown
          SEARXNG_PUBLIC_INSTANCES_ENABLED: 'false'
        run: |
          mkdir -p reports logs data
          set -o pipefail
          python main.py --market-review --force-run 2>&1 | tee logs/smoke-${{ matrix.region }}.log

      - name: Assert real MiniMax route and WeChat-friendly output
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          region = '${{ matrix.region }}'
          log = Path(f'logs/smoke-{region}.log').read_text(encoding='utf-8', errors='replace')
          reports = sorted(Path('reports').glob('market_review_*.md'))
          if not reports:
              raise SystemExit('No market review report generated')

          text = reports[-1].read_text(encoding='utf-8', errors='replace')
          print('report:', reports[-1])
          print('chars:', len(text))
          print('bytes:', len(text.encode('utf-8')))
          print(text[:1600])

          required = [
              'anthropic/minimax-m3',
              'action=generate_review status=success',
              '企业微信消息发送成功',
          ]
          forbidden = [
              'openai/minimax-m3 failed',
              'anthropic/minimax-m3 failed',
              'fallback_template reason=empty_llm_response',
              'authenticationerror',
          ]
          missing = [item for item in required if item.lower() not in log.lower()]
          bad = [item for item in forbidden if item.lower() in log.lower()]
          tables = [line for line in text.splitlines() if line.lstrip().startswith('|')]

          if missing or bad:
              print('Missing required evidence:', missing)
              print('Forbidden error/fallback evidence:', bad)
              sys.exit(1)
          if len(text) > 1400:
              raise SystemExit(f'Report is too long for WeChat brief mode: {len(text)} chars')
          if tables:
              raise SystemExit('Brief report still contains Markdown tables')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opencode-brief-${{ matrix.region }}-${{ github.run_attempt }}
          path: |
            reports/
            logs/
          if-no-files-found: warn
