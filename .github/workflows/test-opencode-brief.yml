name: OpenCode Go Endpoint Probe

on:
  push:
    branches:
      - fix/opencode-go-brief-wechat

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install minimal probe dependencies
        run: pip install 'litellm>=1.80.10,<2.0.0' requests

      - name: Probe OpenCode Go MiniMax M3
        env:
          OPENCODE_GO_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests
          import litellm

          key = os.environ['OPENCODE_GO_API_KEY']
          exact = 'https://opencode.ai/zen/go/v1/messages'
          payload = {
              'model': 'minimax-m3',
              'max_tokens': 12,
              'messages': [{'role': 'user', 'content': 'Reply exactly: OK'}],
          }

          def safe_body(resp):
              text = (resp.text or '').replace('\n', ' ')
              return text[:240]

          print('=== Raw Anthropic Messages endpoint ===')
          raw_success = False
          header_variants = [
              ('x-api-key', {
                  'x-api-key': key,
                  'anthropic-version': '2023-06-01',
                  'content-type': 'application/json',
              }),
              ('bearer', {
                  'authorization': f'Bearer {key}',
                  'anthropic-version': '2023-06-01',
                  'content-type': 'application/json',
              }),
          ]
          for label, headers in header_variants:
              try:
                  resp = requests.post(exact, headers=headers, json=payload, timeout=30)
                  print(f'RAW {label}: status={resp.status_code} content_type={resp.headers.get("content-type", "")} body={safe_body(resp)}')
                  if 200 <= resp.status_code < 300:
                      raw_success = True
              except Exception as exc:
                  print(f'RAW {label}: {type(exc).__name__}: {str(exc)[:240]}')

          print('=== LiteLLM Anthropic api_base candidates ===')
          litellm_success = False
          for base in [
              'https://opencode.ai/zen/go/v1',
              'https://opencode.ai/zen/go',
              'https://opencode.ai/zen/go/v1/messages',
          ]:
              try:
                  response = litellm.completion(
                      model='anthropic/minimax-m3',
                      api_base=base,
                      api_key=key,
                      messages=[{'role': 'user', 'content': 'Reply exactly: OK'}],
                      max_tokens=12,
                      timeout=30,
                  )
                  text = response.choices[0].message.content
                  print(f'LITELLM SUCCESS base={base} response={str(text)[:100]}')
                  litellm_success = True
                  break
              except Exception as exc:
                  print(f'LITELLM FAIL base={base} {type(exc).__name__}: {str(exc)[:400]}')

          if not raw_success:
              raise SystemExit('Exact OpenCode Go /v1/messages endpoint did not accept the configured key/header variants')
          if not litellm_success:
              raise SystemExit('No LiteLLM Anthropic api_base candidate succeeded')
          PY
