name: Schedule Trigger Probe

on:
  schedule:
    # GitHub cron uses UTC; 01:25 UTC = 09:25 Beijing time.
    - cron: '25 1 * * 1-5'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm scheduled event
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "schedule=${{ github.event.schedule }}"
          echo "utc=$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "beijing=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S %Z')"
